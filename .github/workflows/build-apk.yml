name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Variante APK (debug è già firmato e installabile su qualunque dispositivo)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      retention_days:
        description: 'Giorni di conservazione artifact su GitHub (minimo 1)'
        required: true
        default: 1
        type: number

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        run: |
          if [ "${{ inputs.build_variant }}" = "release" ]; then
            ./gradlew :app:android:assembleRelease
          else
            ./gradlew :app:android:assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ inputs.build_variant || 'debug' }}-apk
          path: app/android/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 1 }}
